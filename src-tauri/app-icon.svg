  />

  <!-- Soft reflected light follows the page-like ribbon edge. -->
  <path
    d="M313 680V358c0-17 13-30 30-30h39c11 0 21 4 29 11l232 220"
    stroke="#E6FFFC"
    stroke-opacity="0.34"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  </g>

  <!-- One small glint marks intelligent assistance. -->
  <path d="M797 217c9 34 22 47 56 56-34 9-47 22-56 56-9-34-22-47-56-56 34-9 47-22 56-56Z" fill="#8BE8E0" />
  </g>
