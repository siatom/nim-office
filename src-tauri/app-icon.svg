<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1" />
      <stop offset="1" stop-color="#4338CA" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#plate)" />

  <!-- Second sheet peeking out behind -->
  <g transform="rotate(7 670 466)">
    <rect x="400" y="196" width="540" height="540" rx="56" fill="#ffffff" opacity="0.34" />
  </g>

  <!-- Front sheet -->
  <rect x="224" y="248" width="560" height="560" rx="58" fill="#ffffff" />

  <!-- Text rules -->
  <g fill="#BDB9F0">
    <rect x="312" y="400" width="384" height="56" rx="28" />
    <rect x="312" y="500" width="384" height="56" rx="28" />
    <rect x="312" y="600" width="264" height="56" rx="28" />
  </g>
</svg>
